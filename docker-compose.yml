services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: schoolrecon-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - schoolrecon_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  schoolrecon_sql_data: